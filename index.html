<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A stylized 3D recreation of the Winter Palace (Hermitage, Saint Petersburg), lit by the real Petersburg sky."
    />
    <title>Winter Palace in the browser</title>
    <!-- §2.1: the three self-hosted faces preload on both pages; @font-face in src/fonts.css. -->
    <link rel="preload" href="/fonts/plex-sans-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plex-sans-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plex-serif-400.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <canvas
      id="scene"
      tabindex="0"
      aria-label="Winter Palace walkthrough"
      aria-describedby="scene-help caption-live"
    ></canvas>
    <!-- Overlay, design-sky-time.md §9/§10: title on beat 2, hairline scrub only after settling. -->
    <header id="title" hidden>
      <h1 id="wordmark">Winter Palace</h1>
      <p id="timeline">
        <time id="clock">--:--</time>
        <span id="clock-date"></span>
      </p>
    </header>
    <input
      id="scrub"
      type="range"
      min="-1440"
      max="1440"
      step="1"
      value="0"
      hidden
      aria-label="Petersburg time, ±24 hours around the scene time"
      aria-describedby="scrub-help"
    />
    <span id="scrub-help" class="sr-only"
      >Arrow keys step a minute; PageUp and PageDown step an hour; Home and End pick the window
      bounds; Escape cancels; N returns to now.</span
    >
    <p id="scene-help" class="sr-only">
      Scroll, drag, or use the arrow keys to move along the rail from stop to stop.
    </p>
    <!-- Debug HUD (?hud=1 or the H key): client-only overlay per architecture.md delivery
         rules. aria-hidden: a developer tool, repeated state already announced elsewhere. -->
    <aside id="hud" hidden aria-hidden="true"></aside>
    <!-- Caption overlay (§6.1): the stop's beat text; hidden from AT because #caption-live
         mirrors it. Visible at a rest stop, faded while gliding, the dark-card caption
         during an airlock dwell. data-stop/data-visible are e2e contract rows. -->
    <p id="caption" class="caption" aria-hidden="true" data-visible="false" data-stop=""></p>
    <!-- Live region: «<stop id> · <caption>», rewritten only when it changes (§1.2: stops
         are named in a11y text). -->
    <div id="caption-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <a id="notes-link" href="/notes.html" hidden>How it’s built →</a>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
