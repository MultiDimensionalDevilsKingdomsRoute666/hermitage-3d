<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Стилизованная 3D-реконструкция Зимнего дворца (Эрмитаж, Санкт-Петербург), освещённая настоящим петербургским небом."
    />
    <title>Зимний дворец в браузере</title>
    <!-- §2.1: the three self-hosted faces preload on both pages; @font-face in src/fonts.css. -->
    <link rel="preload" href="/fonts/plex-sans-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plex-sans-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plex-serif-400.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <!-- §1.5: the static shell is RU (the default and canonical language); the runtime
         overwrites for ?lang=en before the overlays are ever shown. -->
    <canvas
      id="scene"
      tabindex="0"
      aria-label="Прогулка по Зимнему дворцу"
      aria-describedby="scene-help caption-live"
    ></canvas>
    <!-- Overlay, design-sky-time.md §9/§10: title on beat 2, hairline scrub only after settling. -->
    <header id="title" hidden>
      <h1 id="wordmark">Зимний дворец</h1>
      <p id="timeline">
        <time id="clock">--:--</time>
        <span id="clock-date"></span>
      </p>
    </header>
    <input
      id="scrub"
      type="range"
      min="-1440"
      max="1440"
      step="1"
      value="0"
      hidden
      aria-label="Петербургское время, ±24 часа от времени сцены"
      aria-describedby="scrub-help"
    />
    <span id="scrub-help" class="sr-only"
      >Стрелки — шаг в минуту; PageUp и PageDown — шаг в час; Home и End — границы окна;
      Escape — отмена; N — вернуться к текущему моменту.</span
    >
    <p id="scene-help" class="sr-only">
      Прокручивайте, перетаскивайте или нажимайте стрелки, чтобы двигаться по маршруту от
      остановки к остановке.
    </p>
    <!-- Debug HUD (?hud=1 or the H key): client-only overlay per architecture.md delivery
         rules. aria-hidden: a developer tool, repeated state already announced elsewhere. -->
    <aside id="hud" hidden aria-hidden="true"></aside>
    <!-- Caption overlay (§6.1): the stop's beat text; hidden from AT because #caption-live
         mirrors it. Visible at a rest stop, faded while gliding, the dark-card caption
         during an airlock dwell. data-stop/data-visible are e2e contract rows. -->
    <!-- §1.2 the bottom chrome row; the r26.1 owner law: the caption rides the SAME bottom
         line, centered between the notes link (left) and the language toggle (right) — one
         baseline, nothing touches. The caption is the rail-driven overlay (captions.ts):
         hidden until settle, opacity-driven, mirrored by #caption-live. -->
    <div id="chrome-row">
      <a id="notes-link" href="/notes.html" hidden>Как это устроено →</a>
      <p id="caption" class="caption" aria-hidden="true" data-visible="false" data-stop=""></p>
      <button id="lang-toggle" type="button" lang="en" aria-label="Русский">RU</button>
    </div>
    <!-- Live region: «<stop id> · <caption>», rewritten only when it changes (§1.2: stops
         are named in a11y text). -->
    <div id="caption-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <!-- §9 travel hint (r26.1): one line above the bottom row, centered on the caption's
         axis; S0-only at the settle beat; the host owns the state machine (src/ui/hint.ts);
         data-visible/data-dismissed are e2e contract rows. -->
    <p id="travel-hint" aria-hidden="true" data-visible="false" data-dismissed="none"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
